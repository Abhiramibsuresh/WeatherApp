
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>

    <div class="weather-container">

        <h1>Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <form id="weatherForm" class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                aria-label="City name"
                required
            >
            <button type="submit" id="searchBtn">
                Get Weather
            </button>
        </form>

        <p id="message" role="status" aria-live="polite">
            Enter a city name to get started.
        </p>

        <div id="weatherResult" class="weather-result hidden">

            <h2 id="cityName"></h2>

            <img id="weatherIcon" src="" alt="Weather icon">

            <p id="temperature"></p>
            <p id="description"></p>

            <div class="details">

                <div class="detail-card">
                    Feels Like
                    <strong id="feelsLike"></strong>
                </div>

                <div class="detail-card">
                    Humidity
                    <strong id="humidity"></strong>
                </div>

                <div class="detail-card">
                    Wind Speed
                    <strong id="windSpeed"></strong>
                </div>

                <div class="detail-card">
                    Pressure
                    <strong id="pressure"></strong>
                </div>

            </div>
        </div>

    </div>

    <script>
        // STEP 1: Add your OpenWeather API key here
        const API_KEY = window.WEATHER_API_KEY;

        // STEP 2: Get HTML elements using their IDs
        const weatherForm = document.getElementById("weatherForm");
        const cityInput = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");
        const message = document.getElementById("message");
        const weatherResult = document.getElementById("weatherResult");

        const cityName = document.getElementById("cityName");
        const weatherIcon = document.getElementById("weatherIcon");
        const temperature = document.getElementById("temperature");
        const description = document.getElementById("description");
        const feelsLike = document.getElementById("feelsLike");
        const humidity = document.getElementById("humidity");
        const windSpeed = document.getElementById("windSpeed");
        const pressure = document.getElementById("pressure");

        // STEP 3: Listen for form submission
        weatherForm.addEventListener("submit", function (event) {
            event.preventDefault();
            getWeather();
        });

        // STEP 4: Create an async function
        async function getWeather() {

            // Read the city entered by the user
            const city = cityInput.value.trim();

            // Check whether the city input is empty
            if (city === "") {
                message.textContent = "Please enter a city name.";
                message.className = "error";
                weatherResult.classList.add("hidden");
                return;
            }

            // Check whether the API key has been replaced
            if (API_KEY === "YOUR_API_KEY" || API_KEY.trim() === "") {
                message.textContent =
                    "Please add your OpenWeather API key in the code.";
                message.className = "error";
                weatherResult.classList.add("hidden");
                return;
            }

            // Show loading status
            message.textContent = "Loading weather information...";
            message.className = "";
            weatherResult.classList.add("hidden");
            searchBtn.disabled = true;

            // Build the API URL
            const url =
                "https://api.openweathermap.org/data/2.5/weather?q="
                + encodeURIComponent(city)
                + "&appid=" + encodeURIComponent(API_KEY)
                + "&units=metric";

            try {
                // Send a request and wait for the response
                const response = await fetch(url);

                // Check whether the HTTP request was successful
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error(
                            "City not found. Please check the spelling."
                        );
                    }

                    if (response.status === 401) {
                        throw new Error(
                            "Invalid or inactive API key. Please check your key."
                        );
                    }

                    if (response.status === 429) {
                        throw new Error(
                            "API request limit reached. Please try again later."
                        );
                    }

                    throw new Error(
                        "Unable to get weather data. Please try again later."
                    );
                }

                // Convert the response body into a JavaScript object
                const data = await response.json();

                // Display the data returned by the API
                cityName.textContent = data.name + ", " + data.sys.country;

                temperature.textContent =
                    Math.round(data.main.temp) + "°C";

                description.textContent =
                    data.weather[0].description;

                feelsLike.textContent =
                    Math.round(data.main.feels_like) + "°C";

                humidity.textContent =
                    data.main.humidity + "%";

                windSpeed.textContent =
                    data.wind.speed + " m/s";

                pressure.textContent =
                    data.main.pressure + " hPa";

                // Display the matching weather icon
                weatherIcon.src =
                    "https://openweathermap.org/img/wn/"
                    + data.weather[0].icon + "@2x.png";

                weatherIcon.alt = data.weather[0].description;

                // Show the weather result section
                weatherResult.classList.remove("hidden");

                // Display a success message
                message.textContent = "Weather information loaded successfully.";
                message.className = "";

            } catch (error) {

                // Display a useful error message
                message.textContent = error.message;
                message.className = "error";
                weatherResult.classList.add("hidden");

            } finally {

                // Re-enable the button whether the request succeeds or fails
                searchBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
